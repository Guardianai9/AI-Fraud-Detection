version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/guardianai
      - SECRET_KEY=your_secret_key_here
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Database service
  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=guardianai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # Frontend web service
  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

  # Documentation service
  docs:
    image: squidfunk/mkdocs-material
    ports:
      - "8001:8000"
    volumes:
      - ./docs:/docs
    command: ["serve", "--dev-addr=0.0.0.0:8000"]

volumes:
  postgres_data: